[JAVA]
# run.py 自动探测 JDK 时扫描的目录（多个用 ; 分隔）。
#
# 扫描规则：遍历每个目录下的 jdk* 条目，读各自的 release 文件拿真实版本，
#          选版本最高的那个（版本号按 release 文件为准，不靠目录名猜）。
#
# 什么时候需要填：
#   如果本机已设 JAVA_HOME、或 PATH 里有 java，其实可以不填（会自动降级）。
#   只有当上面两者都没有、又想让 run.py 自动找 JDK 时，才填这里。
#
# 示例：
#   Windows： search_dirs = D:\Java;E:\Env
#   Linux  ： search_dirs = /usr/lib/jvm;/opt/java
# 留空也可以 —— 会继续尝试 Program Files\Java（Windows）。
search_dirs =

[JENKINS]
url = http://<Jenkins服务器IP>:9090
username = admin
password = 你的Jenkins密码
job_name = ruoyi-testing-frame

[DINGTALK]
# 钉钉机器人 Webhook URL（用于 Jenkins 构建通知 + Python 脚本手动推送）
# 获取方式：钉钉群 → 群设置 → 智能群助手 → 添加机器人 → 自定义 Webhook
# 格式：https://oapi.dingtalk.com/robot/send?access_token=你的token
webhook = https://oapi.dingtalk.com/robot/send?access_token=你的access_token
# 签名密钥（可选，机器人安全设置中如果选择了"加签"才需要填）
secret =