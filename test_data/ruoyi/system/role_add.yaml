# ============================================================
# 新增角色测试用例（8 条）
# ============================================================
# 前置：admin 已登录（ensure_admin_login fixture 写 token）
# 清理：所有 at_% 角色在 session 结束时由 clean_at_test_data 物理删除
# ============================================================

base_info:
  api_name: 新增角色
  url: /system/role
  method: post
  headers:
    Content-Type: application/json;charset=UTF-8

test_cases:
  # ═══════════════════════════════════════════════════════════
  # 有效等价类
  # ═══════════════════════════════════════════════════════════

  - case_name: 新增角色-正常
    json:
      roleName: at_新增正常角色
      roleKey: at_add_role
      roleSort: 10
      dataScope: "1"
      status: "0"
      menuIds: []
      deptIds: []
    validations:
      - type: status_code
        expected: 200
      - type: body_code
        expected: 200
      - type: body_contains
        keyword: 操作成功
    db_verify:
      - desc: sys_role 有记录
        table: sys_role
        where: {role_name: at_新增正常角色}
        expect: exists
      - desc: sys_role_menu 无菜单关联
        table: sys_role_menu
        where: {role_id: "${get_runtime(created_role_id)}"}
        expect: count
        value: 0
      - desc: sys_role_dept 无部门关联
        table: sys_role_dept
        where: {role_id: "${get_runtime(created_role_id)}"}
        expect: count
        value: 0

  # ═══════════════════════════════════════════════════════════
  # 唯一性冲突
  # ═══════════════════════════════════════════════════════════

  - case_name: 新增-角色名称重复
    json:
      roleName: 普通角色
      roleKey: at_dup_name
      roleSort: 10
      dataScope: "1"
      status: "0"
      menuIds: []
      deptIds: []
    validations:
      - type: status_code
        expected: 200
      - type: body_code
        expected: 500
      - type: body_contains
        keyword: 角色名称已存在

  - case_name: 新增-角色权限字符重复
    json:
      roleName: at_权限字符重复
      roleKey: common
      roleSort: 10
      dataScope: "1"
      status: "0"
      menuIds: []
      deptIds: []
    validations:
      - type: status_code
        expected: 200
      - type: body_code
        expected: 500
      - type: body_contains
        keyword: 角色权限已存在

  # ═══════════════════════════════════════════════════════════
  # Bean 校验 —— @NotBlank / @Size / @NotNull
  # ═══════════════════════════════════════════════════════════

  - case_name: 新增-角色名称为空
    json:
      roleName: ""
      roleKey: at_empty_name
      roleSort: 10
      dataScope: "1"
      status: "0"
      menuIds: []
      deptIds: []
    validations:
      - type: status_code
        expected: 200
      - type: body_code
        expected: 500
      - type: body_not_contains
        keyword: 操作成功

  - case_name: 新增-角色名称超长
    json:
      roleName: "1234567890123456789012345678901"
      roleKey: at_long_name
      roleSort: 10
      dataScope: "1"
      status: "0"
      menuIds: []
      deptIds: []
    validations:
      - type: status_code
        expected: 200
      - type: body_code
        expected: 500
      - type: body_not_contains
        keyword: 操作成功

  - case_name: 新增-角色权限字符为空
    json:
      roleName: at_权限字符为空
      roleKey: ""
      roleSort: 10
      dataScope: "1"
      status: "0"
      menuIds: []
      deptIds: []
    validations:
      - type: status_code
        expected: 200
      - type: body_code
        expected: 500
      - type: body_not_contains
        keyword: 操作成功

  - case_name: 新增-角色权限字符超长
    json:
      roleName: at_权限字符超长
      roleKey: "12345678901234567890123456789012345678901234567890123456789012345678901234567890123456789012345678901"
      roleSort: 10
      dataScope: "1"
      status: "0"
      menuIds: []
      deptIds: []
    validations:
      - type: status_code
        expected: 200
      - type: body_code
        expected: 500
      - type: body_not_contains
        keyword: 操作成功

  - case_name: 新增-角色排序为空
    json:
      roleName: at_排序为空
      roleKey: at_null_sort
      dataScope: "1"
      status: "0"
      menuIds: []
      deptIds: []
    validations:
      - type: status_code
        expected: 200
      - type: body_code
        expected: 500
      - type: body_not_contains
        keyword: 操作成功
